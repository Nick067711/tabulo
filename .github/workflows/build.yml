name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter --version
          if [ ! -d android ]; then
            flutter create --org pl.tabmath --project-name tabmath --platforms android /tmp/gen
            cp -r /tmp/gen/android ./android
          fi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp branding/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          sed -i 's/android:label="tabmath"/android:label="TabMath"/' android/app/src/main/AndroidManifest.xml
          # Package name in Google Play (cannot be changed after the first upload).
          sed -i 's/applicationId = "[^"]*"/applicationId = "pl.tabmath.app"/' android/app/build.gradle.kts
          grep -n 'applicationId\|android:label' android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml

      - name: Use the fixed test signing key
        run: |
          # The same key in every build lets a new test version install over the previous one.
          mkdir -p ~/.android
          cp branding/test-signing/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk tabmath-test.apk
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk tabmath-test-uniwersalny.apk
          ls -la *.apk

      - name: Build App Bundle (for Google Play; signed afterwards with the upload key)
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }}
          cp build/app/outputs/bundle/release/app-release.aab tabmath-do-podpisu.aab
          ls -la *.aab
          echo "SDK versions in the bundle manifest:"
          find build/app/intermediates -name AndroidManifest.xml -path '*release*' | head -20 | xargs grep -ho 'android:\(minSdkVersion\|targetSdkVersion\)="[0-9]*"' | sort -u || true
          grep -rho 'targetSdk[^,]*' android/app/build.gradle.kts || true

      - name: Store screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-roboto fonts-dejavu-core fonts-dejavu-extra > /dev/null
          flutter test test/screenshots_test.dart || echo "::warning::Screenshot test failed"
          if [ -d screenshots ]; then (cd screenshots && zip -qr ../tabmath-zrzuty-ekranu.zip .); ls -la screenshots/*; fi

      - uses: actions/upload-artifact@v4
        with:
          name: tabmath-apk
          path: |
            tabmath-test.apk
            tabmath-test-uniwersalny.apk
            tabmath-do-podpisu.aab
            tabmath-zrzuty-ekranu.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TabMath – wersja testowa ${{ github.run_number }}
          body: |
            Testowa wersja TabMath do zainstalowania na telefonie z Androidem.
            Pobierz plik tabmath-test.apk (pasuje do prawie wszystkich telefonów) i otwórz go, aby zainstalować.
            Jeśli telefon zgłosi, że aplikacja nie jest zgodna, pobierz tabmath-test-uniwersalny.apk.
          files: |
            tabmath-test.apk
            tabmath-test-uniwersalny.apk
            tabmath-do-podpisu.aab
            tabmath-zrzuty-ekranu.zip
