name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter --version
          if [ ! -d android ]; then
            flutter create --org pl.tabmath --project-name tabmath --platforms android /tmp/gen
            cp -r /tmp/gen/android ./android
          fi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp branding/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          sed -i 's/android:label="tabmath"/android:label="TabMath"/' android/app/src/main/AndroidManifest.xml
          # Package name in Google Play (cannot be changed after the first upload).
          sed -i 's/applicationId = "[^"]*"/applicationId = "pl.tabmath.app"/' android/app/build.gradle.kts
          grep -n 'applicationId\|android:label' android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml

      - name: Use the fixed test signing key
        run: |
          # The same key in every build lets a new test version install over the previous one.
          mkdir -p ~/.android
          cp branding/test-signing/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk tabmath-test.apk
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk tabmath-test-uniwersalny.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tabmath-apk
          path: |
            tabmath-test.apk
            tabmath-test-uniwersalny.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TabMath – wersja testowa ${{ github.run_number }}
          body: |
            Testowa wersja TabMath do zainstalowania na telefonie z Androidem.
            Pobierz plik tabmath-test.apk (pasuje do prawie wszystkich telefonów) i otwórz go, aby zainstalować.
            Jeśli telefon zgłosi, że aplikacja nie jest zgodna, pobierz tabmath-test-uniwersalny.apk.
          files: |
            tabmath-test.apk
            tabmath-test-uniwersalny.apk
